<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Name: the cover story</title> <!-- edit: your product's name -->

  <!-- Styles load in this order: tokens first, so everything else can use them. -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- One display typeface. To change it: swap the family here AND in --font-display. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,900;1,9..144,400&display=swap">
</head>

<body>
  <main class="cover">

    <header class="masthead">
      <p class="masthead-name">Magazine Name</p> <!-- edit: the magazine you chose -->
      <button class="theme-toggle" type="button">Dark</button>
    </header>

    <figure class="hero">
      <!-- edit: put your image in img/ and describe it in one sentence for people who can't see it -->
      <img src="img/hero.svg" alt="Abstract placeholder: two overlapping blue circles on grey.">
    </figure>

    <h1 class="headline">Headline goes here, three lines at the most.</h1> <!-- edit -->
    <p class="six-words">Six words that say the vision.</p> <!-- edit: exactly six -->

    <section class="quotes">
      <blockquote class="quote">
        <p>“What the art critic said about it.”</p> <!-- edit -->
        <footer>Critic's name, publication</footer>
      </blockquote>
      <blockquote class="quote">
        <p>“What the usability reviewer said about it.”</p> <!-- edit -->
        <footer>Reviewer's name, publication</footer>
      </blockquote>
    </section>

    <footer class="byline">
      <p>Product Name</p> <!-- edit -->
      <p>Your Name, December 2026</p> <!-- edit -->
    </footer>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
